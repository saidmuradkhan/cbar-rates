<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>cbar-rates</title>
<style>
  :root {
    --text: #1f2328; --muted: #656d76; --bg: #f6f8fa; --surface: #fff;
    --border: #d0d7de; --accent: #0969da;
    color-scheme: light dark;
    font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e6edf3; --muted: #8d96a0; --bg: #0d1117; --surface: #161b22;
            --border: #30363d; --accent: #4493f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; color: var(--text); background: var(--bg); }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 1.5rem; }
  a { color: var(--accent); text-decoration: none; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
  label.amount { grid-column: 1 / -1; }
  input, select, button {
    font: inherit; color: inherit; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); width: 100%;
  }
  button { cursor: pointer; width: auto; }
  .result { margin-top: 16px; font-size: 1.8rem; font-weight: 600; word-break: break-word; }
  .error { color: #cf222e; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 6px 0; text-align: left; border-bottom: 1px solid var(--border); }
  td:last-child, th:last-child { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h2 { margin: 0; font-size: 1rem; }
  .chart-wrap { position: relative; margin-top: 12px; }
  #chart { display: block; width: 100%; height: 200px; touch-action: pan-y; }
  #chart text { fill: var(--muted); font-size: 12px; }
  #chart .grid { stroke: var(--border); stroke-width: 1; }
  #chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  #chart .area { fill: var(--accent); opacity: .12; }
  #chart .cursor { stroke: var(--muted); stroke-width: 1; }
  #chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .tip {
    position: absolute; top: 0; transform: translateX(-50%); pointer-events: none; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: .85rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>cbar-rates</h1>
    <span class="muted"><a href="/api">API</a></span>
  </header>

  <section class="card">
    <form id="converter">
      <label class="amount">Amount
        <input id="amount" type="number" min="0" step="any" value="100" inputmode="decimal">
      </label>
      <label>From <select id="from"></select></label>
      <button type="button" id="swap" title="Swap currencies" aria-label="Swap currencies">⇄</button>
      <label>To <select id="to"></select></label>
    </form>
    <div class="result" id="result">…</div>
    <div class="muted" id="details"></div>
  </section>

  <section class="card" id="chart-card" hidden>
    <div class="chart-head">
      <h2 id="chart-title"></h2>
      <span class="muted" id="chart-change"></span>
    </div>
    <div class="chart-wrap">
      <svg id="chart" role="img"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>

  <section class="card">
    <table>
      <thead><tr><th>Currency</th><th>AZN</th></tr></thead>
      <tbody id="popular"></tbody>
    </table>
    <p class="muted" id="source">Official rates of the Central Bank of Azerbaijan.</p>
  </section>
</main>

<script>
  const POPULAR = ["USD", "EUR", "GBP", "RUB", "TRY", "GEL"];
  const $ = (id) => document.getElementById(id);

  async function getJSON(url) {
    const response = await fetch(url);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    return data;
  }

  function fillSelect(select, codes, selected) {
    for (const code of codes) {
      select.add(new Option(code, code, false, code === selected));
    }
  }

  function showPopular(rates, date) {
    for (const rate of rates.filter((r) => POPULAR.includes(r.code))) {
      const row = $("popular").insertRow();
      row.insertCell().textContent = `${rate.nominal} ${rate.code}`;
      row.insertCell().textContent = rate.value.toFixed(4);
    }
    $("source").textContent = `Official CBAR rates for ${date}.`;
  }

  let timer;
  function scheduleConvert() {
    clearTimeout(timer);
    timer = setTimeout(convert, 250);
  }

  async function convert() {
    const amount = $("amount").value;
    const from = $("from").value;
    const to = $("to").value;
    if (amount === "" || Number(amount) < 0) {
      $("result").textContent = "…";
      $("details").textContent = "";
      return;
    }
    try {
      const params = new URLSearchParams({ from, to, amount });
      const data = await getJSON(`/convert?${params}`);
      $("result").classList.remove("error");
      $("result").textContent = `${data.result.toLocaleString()} ${data.to}`;
      $("details").textContent = `1 ${data.from} = ${data.rate} ${data.to} · ${data.date}`;
    } catch (error) {
      $("result").classList.add("error");
      $("result").textContent = error.message;
      $("details").textContent = "";
    }
  }

  const SVG = "http://www.w3.org/2000/svg";
  const HEIGHT = 200;
  const PAD = { top: 28, right: 12, bottom: 24, left: 52 };
  let chartPoints = [];

  function svgEl(name, attrs) {
    const el = document.createElementNS(SVG, name);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
    return el;
  }

  function formatRate(value) {
    return String(Number(value.toPrecision(5)));
  }

  async function perUnitByDate(code) {
    if (code === "AZN") return null;
    const data = await getJSON(`/history/${code}?days=30`);
    return new Map(data.points.map((p) => [p.date, p.per_unit]));
  }

  async function loadChart() {
    const from = $("from").value;
    const to = $("to").value;
    if (from === to) {
      $("chart-card").hidden = true;
      return;
    }
    try {
      const [fromAZN, toAZN] = await Promise.all([perUnitByDate(from), perUnitByDate(to)]);
      const dates = [...(fromAZN || toAZN).keys()];
      const points = dates
        .map((date) => ({
          date,
          value: (fromAZN ? fromAZN.get(date) : 1) / (toAZN ? toAZN.get(date) : 1),
        }))
        .filter((p) => Number.isFinite(p.value));
      if (from !== $("from").value || to !== $("to").value) return;
      chartPoints = points;

      $("chart-title").textContent = `1 ${from} in ${to}, last 30 days`;
      const first = chartPoints[0].value;
      const last = chartPoints[chartPoints.length - 1].value;
      const change = ((last - first) / first) * 100;
      $("chart-change").textContent = `${change >= 0 ? "+" : ""}${change.toFixed(2)}%`;
      $("chart-card").hidden = false;
      drawChart();
    } catch (error) {
      $("chart-card").hidden = true;
    }
  }

  function drawChart() {
    const svg = $("chart");
    const width = svg.clientWidth;
    if (!width || chartPoints.length === 0) return;
    svg.setAttribute("viewBox", `0 0 ${width} ${HEIGHT}`);
    svg.replaceChildren();

    const values = chartPoints.map((p) => p.value);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (max - min < max * 0.002) {
      min -= max * 0.005;
      max += max * 0.005;
    }
    const x = (i) => PAD.left + (i / Math.max(chartPoints.length - 1, 1)) * (width - PAD.left - PAD.right);
    const y = (v) => PAD.top + ((max - v) / (max - min)) * (HEIGHT - PAD.top - PAD.bottom);

    for (const v of [min, (min + max) / 2, max]) {
      svg.append(svgEl("line", { class: "grid", x1: PAD.left, x2: width - PAD.right, y1: y(v), y2: y(v) }));
      const label = svgEl("text", { x: PAD.left - 8, y: y(v) + 4, "text-anchor": "end" });
      label.textContent = formatRate(v);
      svg.append(label);
    }

    const first = chartPoints[0];
    const last = chartPoints[chartPoints.length - 1];
    for (const [point, i, anchor] of [[first, 0, "start"], [last, chartPoints.length - 1, "end"]]) {
      const label = svgEl("text", { x: x(i), y: HEIGHT - 6, "text-anchor": anchor });
      label.textContent = point.date.slice(5);
      svg.append(label);
    }

    const line = chartPoints.map((p, i) => `${x(i)},${y(p.value)}`).join(" ");
    const bottom = HEIGHT - PAD.bottom;
    svg.append(svgEl("polygon", {
      class: "area",
      points: `${x(0)},${bottom} ${line} ${x(chartPoints.length - 1)},${bottom}`,
    }));
    svg.append(svgEl("polyline", { class: "line", points: line }));

    const cursor = svgEl("line", { class: "cursor", y1: PAD.top, y2: bottom, visibility: "hidden" });
    const dot = svgEl("circle", { class: "dot", r: 5, visibility: "hidden" });
    svg.append(cursor, dot);
    svg.setAttribute("aria-label",
      `${$("chart-title").textContent}: from ${formatRate(first.value)} on ${first.date} to ${formatRate(last.value)} on ${last.date}`);

    svg.onpointermove = (event) => {
      const box = svg.getBoundingClientRect();
      const step = (width - PAD.left - PAD.right) / Math.max(chartPoints.length - 1, 1);
      const i = Math.min(chartPoints.length - 1, Math.max(0, Math.round((event.clientX - box.left - PAD.left) / step)));
      const point = chartPoints[i];
      for (const el of [cursor, dot]) el.setAttribute("visibility", "visible");
      cursor.setAttribute("x1", x(i));
      cursor.setAttribute("x2", x(i));
      dot.setAttribute("cx", x(i));
      dot.setAttribute("cy", y(point.value));
      $("tip").hidden = false;
      $("tip").style.left = `${Math.min(Math.max(x(i), 60), width - 60)}px`;
      $("tip").textContent = `${point.date} · ${formatRate(point.value)} ${$("to").value}`;
    };
    svg.onpointerleave = () => {
      for (const el of [cursor, dot]) el.setAttribute("visibility", "hidden");
      $("tip").hidden = true;
    };
  }

  async function start() {
    try {
      const data = await getJSON("/rates");
      const codes = ["AZN", ...data.rates.map((r) => r.code)];
      fillSelect($("from"), codes, "USD");
      fillSelect($("to"), codes, "AZN");
      showPopular(data.rates, data.date);
      convert();
      loadChart();
    } catch (error) {
      $("result").classList.add("error");
      $("result").textContent = error.message;
    }
  }

  $("converter").addEventListener("input", scheduleConvert);
  $("converter").addEventListener("submit", (event) => event.preventDefault());
  $("from").addEventListener("change", loadChart);
  $("to").addEventListener("change", loadChart);
  $("swap").addEventListener("click", () => {
    [$("from").value, $("to").value] = [$("to").value, $("from").value];
    convert();
    loadChart();
  });
  window.addEventListener("resize", drawChart);
  start();
</script>
</body>
</html>
